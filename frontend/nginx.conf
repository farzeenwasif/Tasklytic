server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  # Cache hashed build assets for long; index.html always fresh
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # React Router: every unknown path serves the app
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
