# Run the whole app:   docker compose up --build
#   Web app -> http://localhost:5173
#   API     -> http://localhost:8000
#
# The API reads backend/.env (MongoDB Atlas, Stripe, Cloudinary...).
# To use a local MongoDB instead of Atlas, set in backend/.env:
#   MONGO_URI=mongodb://mongo:27017/tasklytic
# and run:   docker compose --profile local-db up --build

services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      PORT: 8000
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped

  mongo:
    image: mongo:7
    profiles: ["local-db"]
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

volumes:
  mongo-data:
